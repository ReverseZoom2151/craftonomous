name: Bug report
description: Something behaves differently from what the docs claim.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report.

        **Security issues do not belong here.** If this is a vulnerability,
        please follow [SECURITY.md](../blob/main/SECURITY.md) and report it
        privately instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: >
        If a README or docs/ statement led you to expect something different,
        quote it. A claim that does not match the implementation is itself a
        bug worth fixing.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest set of steps or code that shows the problem.
      placeholder: |
        1. Start a local server with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Perception profile
      options:
        - fair-play
        - xray
        - omniscient
        - not applicable
        - unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Craftonomous version or commit
      placeholder: '0.0.1, or a commit SHA'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: 'output of `node --version`'
    validations:
      required: true

  - type: input
    id: minecraft
    attributes:
      label: Minecraft version and server type
      placeholder: '1.21.1, local vanilla server, offline auth'

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Windows 11 / macOS 15 / Ubuntu 24.04'

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: >
        Paste relevant output. Raising LOG_LEVEL to `debug` often helps.
        Redact any credentials first.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I am not reporting a security vulnerability here.
          required: true
